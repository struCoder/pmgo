version: '3.8'

services:
  pmgo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmgo
    restart: unless-stopped
    ports:
      - "9876:9876"   # API port
      - "8080:8080"   # Web interface port
    volumes:
      - pmgo_data:/app/data
      - pmgo_logs:/app/logs
      - ./configs:/app/configs
    environment:
      - PMGO_LOG_LEVEL=info
      - PMGO_LOG_FORMAT=json
    networks:
      - pmgo_network
    healthcheck:
      test: ["CMD", "./pmgo", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a reverse proxy
  nginx:
    image: nginx:alpine
    container_name: pmgo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pmgo
    networks:
      - pmgo_network
    profiles:
      - production

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: pmgo_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pmgo_network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: pmgo_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - pmgo_network
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  pmgo_network:
    driver: bridge

volumes:
  pmgo_data:
    driver: local
  pmgo_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local